plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.gravityflip'

base {
    archivesName = 'gravityflip'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                gravityflip {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                gravityflip {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
    maven { name = 'BMCLAPI'; url = 'https://bmclapi2.bangbang93.com/maven' }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.2.0"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'    : 'gravityflip',
                'Specification-Vendor'   : 'gravityflip',
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.jar.archiveVersion,
                'Implementation-Vendor'  : 'gravityflip'
        ])
    }
    finalizedBy 'reobfJar'
}
